name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up JDK 8
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: '8'
          cache: sbt

      - name: Set up sbt
        uses: coursier/setup-action@v3.0.0
        with:
          apps: sbt

      - name: Run tests and generate coverage
        run: sbt clean coverage mogCoreJVM/test coverageReport coverageAggregate

      - name: Upload coverage to Coveralls
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
          COVERALLS_SERVICE_NAME: github-actions
          CI_NAME: github-actions
          CI_BRANCH: ${{ github.ref_name }}
          CI_BUILD_NUMBER: ${{ github.run_id }}
          CI_BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CI_PULL_REQUEST: ${{ github.event.pull_request.html_url || '' }}
        run: sbt coveralls
